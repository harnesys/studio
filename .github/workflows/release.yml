name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build binaries
        run: |
          t=${{ matrix.target }}
          bun build --compile --target=$t apps/server/src/index.ts --outfile harnesys-host
          bun build --compile --target=$t apps/webui/server/index.ts --outfile harnesys-web
          bun build --compile --target=$t apps/cli/src/index.ts --outfile harnesys
          mkdir -p out
          suffix=${t#bun-}
          for bin in harnesys harnesys-host harnesys-web; do
            mv "$bin" "out/$bin-$suffix"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: out/*

  client-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:client
      - run: (cd apps/webui && zip -qr ../../client-dist.zip dist)
      - uses: actions/upload-artifact@v7
        with:
          name: client-dist
          path: client-dist.zip

  desktop:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: bun install
      - name: Build DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bun run build:desktop --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    needs: [server, client-dist, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
