<!doctype html>
<html lang="en" class="dark" data-scale="middle" data-accent="orange" data-chat-font="medium">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harnesys</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        transition: opacity 240ms ease;
      }
      html.dark #app-splash {
        background: #0f1114;
        color: #8a9098;
      }
      html:not(.dark) #app-splash {
        background: #f4f5f6;
        color: #667078;
      }
      #app-splash.is-done {
        opacity: 0;
      }
      .app-logo-spec {
        animation: app-logo-shimmer 3.2s ease-in-out infinite;
      }
      @keyframes app-logo-shimmer {
        0%,
        100% {
          opacity: 0.65;
        }
        50% {
          opacity: 1;
        }
      }
      .app-logo-sweep {
        transform-box: fill-box;
        transform-origin: center;
        animation: app-logo-sweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-logo-sweep {
        0% {
          transform: translateX(0) skewX(-14deg);
          opacity: 0;
        }
        8% {
          opacity: 1;
        }
        38% {
          transform: translateX(2050px) skewX(-14deg);
          opacity: 1;
        }
        45%,
        100% {
          transform: translateX(2050px) skewX(-14deg);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-logo-spec,
        .app-logo-sweep {
          animation: none;
        }
        .app-logo-sweep {
          opacity: 0;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem("theme")
          var resolved =
            theme === "light" || theme === "dark"
              ? theme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
          root.classList.remove("light", "dark")
          root.classList.add(resolved)
          var scale = localStorage.getItem("ui-scale")
          if (scale === "small" || scale === "middle" || scale === "large" || scale === "extra") {
            root.dataset.scale = scale
          }
          var accent = localStorage.getItem("ui-accent")
          if (
            accent === "red" ||
            accent === "orange" ||
            accent === "yellow" ||
            accent === "green" ||
            accent === "iris" ||
            accent === "indigo" ||
            accent === "violet"
          ) {
            root.dataset.accent = accent
          }
          var chatPrefs = localStorage.getItem("studio-chat-preferences")
          if (chatPrefs) {
            var chatFont = JSON.parse(chatPrefs).state.chatFontSize
            if (
              chatFont === "small" ||
              chatFont === "medium" ||
              chatFont === "large" ||
              chatFont === "xl"
            ) {
              root.dataset.chatFont = chatFont
            }
          }
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <svg viewBox="0 0 1024 1024" fill="none" width="96" height="96">
        <defs>
          <linearGradient id="splash-body" x1="512" y1="152" x2="512" y2="872" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2e3947"/>
            <stop offset="0.45" stop-color="#161b22"/>
            <stop offset="1" stop-color="#080b0f"/>
          </linearGradient>
          <linearGradient id="splash-spec" x1="512" y1="152" x2="512" y2="352" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f4f8fa"/>
            <stop offset="1" stop-color="#93a5b4"/>
          </linearGradient>
          <linearGradient id="splash-glint" x1="512" y1="652" x2="512" y2="872" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#c7d3dd"/>
            <stop offset="1" stop-color="#5d6b78"/>
          </linearGradient>
          <linearGradient id="splash-edge" x1="512" y1="152" x2="512" y2="872" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
          </linearGradient>
          <clipPath id="splash-clip">
            <path d="M152 152h250v280h220V152h250v720H622V592H402v280H152Z"/>
          </clipPath>
          <linearGradient id="splash-sweep" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#splash-clip)">
          <path d="M152 152h250v280h220V152h250v720H622V592H402v280H152Z" fill="url(#splash-body)"/>
          <polygon points="402,152 402,712 152,772" fill="#0a0d11" opacity="0.9"/>
          <polygon class="app-logo-spec" points="152,152 402,152 152,352" fill="url(#splash-spec)" opacity="0.9"/>
          <polygon points="402,152 362,152 402,252" fill="#dfe7ec" opacity="0.35"/>
          <polygon points="152,872 372,872 152,652" fill="url(#splash-glint)" opacity="0.55"/>
          <rect x="152" y="152" width="10" height="720" fill="url(#splash-edge)"/>
          <polygon points="252,252 278,252 218,432 198,432" fill="#ffffff" opacity="0.22"/>
          <polygon points="622,152 622,712 872,772" fill="#0a0d11" opacity="0.9"/>
          <polygon class="app-logo-spec" points="872,152 622,152 872,352" fill="url(#splash-spec)" opacity="0.9"/>
          <polygon points="622,152 662,152 622,252" fill="#dfe7ec" opacity="0.35"/>
          <polygon points="872,872 652,872 872,652" fill="url(#splash-glint)" opacity="0.55"/>
          <rect x="862" y="152" width="10" height="720" fill="url(#splash-edge)"/>
          <polygon points="792,552 812,552 762,712 742,712" fill="#ffffff" opacity="0.15"/>
          <polygon points="402,432 622,432 402,532" fill="#e8eef2" opacity="0.6"/>
          <polygon points="402,592 622,592 522,702" fill="#090c10" opacity="0.9"/>
          <polygon points="402,332 402,432 492,432" fill="#dbe4ea" opacity="0.4"/>
          <polygon points="622,332 622,432 532,432" fill="#dbe4ea" opacity="0.25"/>
        </g>
        <g clip-path="url(#splash-clip)">
          <rect class="app-logo-sweep" x="-620" y="0" width="420" height="1024" fill="url(#splash-sweep)"/>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
