name: pages
on:
  push:
    branches: [main]
    paths: ['landing/**']
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
